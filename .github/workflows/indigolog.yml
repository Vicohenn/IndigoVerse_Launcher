name: IndigoLog (mod do servidor)
on:
  push:
    paths: ['server-mods/indigolog/**', '.github/workflows/indigolog.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-mods/indigolog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: indigolog
          path: server-mods/indigolog/build/libs/*.jar
      - name: Publicar o .jar no repositório (server-mods/dist)
        working-directory: .
        run: |
          mkdir -p server-mods/dist
          cp server-mods/indigolog/build/libs/indigolog-*.jar server-mods/dist/
          rm -f server-mods/dist/*-sources.jar
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add server-mods/dist
          git commit -m "IndigoLog: jar compilado" || exit 0
          git push
