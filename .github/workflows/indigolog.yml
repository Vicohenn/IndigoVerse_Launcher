name: Mods do servidor (IndigoLog, Guild Tags, IndigoVIP, IndigoSpawn)
on:
  push:
    paths: ['server-mods/indigolog/**', 'server-mods/guildtags/**', 'server-mods/indigovip/**', 'server-mods/indigospawn/**', 'server-mods/legendlimit-patch/**', '.github/workflows/indigolog.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Compilar IndigoLog
        working-directory: server-mods/indigolog
        run: gradle build --no-daemon
      - name: Compilar Guild Tags
        working-directory: server-mods/guildtags
        run: gradle build --no-daemon 2>&1 | tee build.log
      - name: Compilar IndigoVIP
        working-directory: server-mods/indigovip
        run: gradle build --no-daemon
      - name: Compilar IndigoSpawn
        working-directory: server-mods/indigospawn
        run: gradle build --no-daemon 2>&1 | tee build.log
      - name: Compilar legendlimit 1.2.0 (limites por captura + barril sem drop)
        working-directory: server-mods/legendlimit-patch
        run: |
          set -e
          gradle build --no-daemon
          J=$(ls build/libs/legendlimit-patch-*[0-9].jar)
          rm -rf novo && mkdir novo && cd novo
          unzip -q ../libs/legendlimit-1.1.0.jar
          rm -f legend/limit/*.class
          unzip -oq "../$J" 'legend/limit/*.class'
          sed -i 's/"version": "1.1.0"/"version": "1.2.0"/' fabric.mod.json
          ls -l legend/limit/
          zip -qr ../legendlimit-1.2.0.jar .
          cd .. && javap -p -cp legendlimit-1.2.0.jar legend.limit.BarrelConverter | grep -E 'apagarItensNovos|class_'; javap -p -cp legendlimit-1.2.0.jar legend.limit.Limites legend.limit.UsageData | grep -E 'limite|capturou|Extras'
      - name: Nomes da classe Explosion (diagnóstico)
        if: always()
        run: |
          J=$(find server-mods ~/.gradle -path '*minecraft*' -name '*.jar' 2>/dev/null | grep -i -E 'merged|common' | grep -i yarn | head -1)
          echo "$J"; javap -p -cp "$J" net.minecraft.server.network.ServerPlayerEntity | grep -iE 'spawn' || true
      - name: Conferir mixin do IndigoSpawn
        working-directory: server-mods/indigospawn
        run: |
          grep -iE "cannot find|not find|unable to locate" build.log && exit 1 || true
          unzip -p build/libs/indigospawn-*[0-9].jar '*refmap.json'
      - name: Conferir alvos dos mixins (refmap)
        working-directory: server-mods/guildtags
        run: |
          grep -iE "cannot find|not find|unable to locate" build.log && exit 1 || true
          unzip -p build/libs/guildtags-*[0-9].jar '*refmap.json'
      - name: Publicar os .jar no repositório (server-mods/dist)
        run: |
          mkdir -p server-mods/dist
          cp server-mods/indigolog/build/libs/indigolog-*.jar server-mods/guildtags/build/libs/guildtags-*.jar server-mods/indigovip/build/libs/indigovip-*.jar server-mods/indigospawn/build/libs/indigospawn-*.jar server-mods/legendlimit-patch/legendlimit-1.2.0.jar server-mods/dist/
          rm -f server-mods/dist/*-sources.jar
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add server-mods/dist
          git commit -m "Mods do servidor: jars compilados" || exit 0
          git pull --rebase --autostash
          git push
