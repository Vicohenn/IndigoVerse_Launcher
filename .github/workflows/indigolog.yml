name: Mods do servidor (IndigoLog, Guild Tags, IndigoVIP)
on:
  push:
    paths: ['server-mods/indigolog/**', 'server-mods/guildtags/**', 'server-mods/indigovip/**', '.github/workflows/indigolog.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Compilar IndigoLog
        working-directory: server-mods/indigolog
        run: gradle build --no-daemon
      - name: Compilar Guild Tags
        working-directory: server-mods/guildtags
        run: gradle build --no-daemon 2>&1 | tee build.log
      - name: Compilar IndigoVIP
        working-directory: server-mods/indigovip
        run: gradle build --no-daemon
      - name: Conferir alvos dos mixins (refmap)
        working-directory: server-mods/guildtags
        run: |
          grep -iE "cannot find|not find|unable to locate" build.log && exit 1 || true
          unzip -p build/libs/guildtags-*[0-9].jar '*refmap.json'
      - name: Publicar os .jar no repositório (server-mods/dist)
        run: |
          mkdir -p server-mods/dist
          cp server-mods/indigolog/build/libs/indigolog-*.jar server-mods/guildtags/build/libs/guildtags-*.jar server-mods/indigovip/build/libs/indigovip-*.jar server-mods/dist/
          rm -f server-mods/dist/*-sources.jar
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git pull --rebase
          git add server-mods/dist
          git commit -m "Mods do servidor: jars compilados" || exit 0
          git push
