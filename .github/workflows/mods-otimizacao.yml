name: Mods de otimização (C2ME, Chunky, spark, ImmediatelyFast)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/mods-otimizacao.yml']
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Baixar do Modrinth (1.21.1 / Fabric)
        run: |
          set -e
          mkdir -p extra-mods/otimizacao
          rm -f extra-mods/otimizacao/*.jar
          for p in c2me-fabric chunky spark immediatelyfast; do
            curl -sfL -A "Vicohenn/IndigoVerse_Launcher (github actions)" \
              "https://api.modrinth.com/v2/project/$p/version?game_versions=%5B%221.21.1%22%5D&loaders=%5B%22fabric%22%5D" > v.json
            url=$(jq -r '(map(select(.version_type=="release"))[0] // .[0]) | .files[] | select(.primary) | .url' v.json)
            echo "$p -> $(jq -r '(map(select(.version_type=="release"))[0] // .[0]) | .version_number + " (" + .version_type + ")"' v.json) $url"
            curl -sfL -o "extra-mods/otimizacao/$(basename "$url")" "$url"
          done
          for j in extra-mods/otimizacao/*.jar; do echo "== $j"; unzip -p "$j" fabric.mod.json | jq -c '{id,version,environment,depends}'; done
      - name: ImmediatelyFast no modpack (só cliente)
        run: |
          set -e
          gh release download pack --repo "$REPO" -p distribution.json -O dist.json
          python3 - <<'EOF'
          import json, hashlib, os, glob, zipfile, re
          d = json.load(open('dist.json', encoding='utf-8'))
          base = 'https://github.com/' + os.environ['REPO'] + '/releases/download/pack/'
          os.makedirs('up', exist_ok=True)
          srv = d['servers'][0]
          limpo = lambda s: re.sub(r'[:@/\\\s]', '_', s)
          for j in glob.glob('extra-mods/otimizacao/*.jar'):
              mj = json.loads(zipfile.ZipFile(j).read('fabric.mod.json').decode('utf-8', 'replace'))
              if mj['id'] != 'immediatelyfast':
                  continue
              b = open(j, 'rb').read()
              nome = 'mod_' + re.sub(r'[^A-Za-z0-9._-]', '_', os.path.basename(j))
              open('up/' + nome, 'wb').write(b)
              srv['modules'] = [m for m in srv['modules'] if ':immediatelyfast:' not in m['id']]
              srv['modules'].append({'id': f"indigoverse:immediatelyfast:{limpo(mj['version'])}@jar", 'name': mj.get('name', 'ImmediatelyFast'),
                                     'type': 'FabricMod', 'required': {'value': False, 'def': True},
                                     'artifact': {'size': len(b), 'MD5': hashlib.md5(b).hexdigest(), 'url': base + nome}})
          v = srv['version'].split('+')
          srv['version'] = v[0] + '+' + '.'.join(sorted(set((v[1].split('.') if len(v) > 1 else []) + ['otim'])))
          json.dump(d, open('up/distribution.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(len(srv['modules']), 'módulos', srv['version'])
          EOF
          gh release upload pack up/* --repo "$REPO" --clobber
      - name: Guardar os .jar no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git pull --rebase
          git add extra-mods
          git commit -m "Mods de otimização" || exit 0
          git push
