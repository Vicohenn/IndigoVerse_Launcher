name: Configs extras do pack (minimapa etc.)
on:
  workflow_dispatch:
  push:
    paths: ['pack-config/**', 'pack-remover.txt', 'pack-adicionar.json', 'pack-endereco.txt', '.github/workflows/pack-config.yml']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar os arquivos de pack-config ao distribution.json
        run: |
          set -e
          gh release download pack --repo "$REPO" -p distribution.json -O dist.json
          python3 - <<'EOF'
          import json, hashlib, os, re
          d = json.load(open('dist.json', encoding='utf-8'))
          base = 'https://github.com/' + os.environ['REPO'] + '/releases/download/pack/'
          os.makedirs('up', exist_ok=True)
          srv = d['servers'][0]
          novos = []
          for raiz, _, arqs in os.walk('pack-config'):
              for a in arqs:
                  cheio = os.path.join(raiz, a)
                  rel = os.path.relpath(cheio, 'pack-config').replace(os.sep, '/')
                  b = open(cheio, 'rb').read()
                  nome = re.sub(r'[^A-Za-z0-9._-]', '_', 'file_' + rel.replace('/', '__'))
                  open('up/' + nome, 'wb').write(b)
                  novos.append({'id': rel, 'name': os.path.basename(rel), 'type': 'File',
                                'artifact': {'size': len(b), 'MD5': hashlib.md5(b).hexdigest(), 'url': base + nome, 'path': rel}})
          ids = {m['id'] for m in novos}
          srv['modules'] = [m for m in srv['modules'] if m['id'] not in ids] + novos
          # tira do download automático o que estiver em pack-remover.txt
          remover = set()
          if os.path.exists('pack-remover.txt'):
              remover = {l.strip() for l in open('pack-remover.txt', encoding='utf-8') if l.strip() and not l.startswith('#')}
          antes = len(srv['modules'])
          srv['modules'] = [m for m in srv['modules'] if m['id'] not in remover]
          print('removidos do download automático:', antes - len(srv['modules']))
          # devolve ao download módulos que já estão no release (pack-adicionar.json: lista de módulos)
          if os.path.exists('pack-adicionar.json'):
              for m in json.load(open('pack-adicionar.json', encoding='utf-8')):
                  if m['id'] not in remover and not any(x['id'] == m['id'] for x in srv['modules']):
                      srv['modules'].append(m)
                      print('devolvido ao download:', m['id'])
          # endereço do servidor (playit.gg etc.)
          if os.path.exists('pack-endereco.txt'):
              end = open('pack-endereco.txt', encoding='utf-8').read().strip()
              if end:
                  print('endereço:', srv.get('address'), '->', end)
                  srv['address'] = end
          v = srv['version'].split('+')
          srv['version'] = v[0] + '+' + '.'.join(sorted(set((v[1].split('.') if len(v) > 1 else []) + ['cfg'])))
          json.dump(d, open('up/distribution.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(len(novos), 'arquivos;', len(srv['modules']), 'módulos;', srv['version'])
          EOF
          gh release upload pack up/* --repo "$REPO" --clobber
